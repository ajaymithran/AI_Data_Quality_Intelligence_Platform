<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AI Data Quality Intelligence Platform">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#101a2f"/>
      <stop offset="1" stop-color="#102f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="score" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".65"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".18" r=".72">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dbeafe" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="26.5" fill="none" stroke="#7dd3fc" stroke-opacity=".16"/>

  <g filter="url(#shadow)" transform="translate(824 54)">
    <rect width="302" height="212" rx="18" fill="#111827" fill-opacity=".92" stroke="#94a3b8" stroke-opacity=".18"/>
    <rect x="1" y="1" width="300" height="38" rx="17" fill="#1e293b" fill-opacity=".92"/>
    <circle cx="22" cy="20" r="5" fill="#fb7185"/>
    <circle cx="38" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="54" cy="20" r="5" fill="#4ade80"/>
    <text x="76" y="25" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">DATA QUALITY REPORT</text>

    <g transform="translate(24 58)">
      <text x="0" y="16" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="14">QUALITY SCORE</text>
      <text x="254" y="16" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end">92</text>
      <rect y="28" width="254" height="9" rx="4.5" fill="#334155"/>
      <rect y="28" width="234" height="9" rx="4.5" fill="url(#accent)"/>

      <g transform="translate(0 72)">
        <rect width="254" height="46" rx="10" fill="#22c55e" fill-opacity=".09" stroke="#4ade80" stroke-opacity=".28"/>
        <circle cx="24" cy="23" r="10" fill="#22c55e" fill-opacity=".18"/>
        <path d="M18 23l4 4 8-9" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="28" fill="#86efac" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">PASS WITH WARNINGS</text>
      </g>

      <g transform="translate(0 134)">
        <text x="0" y="0" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="11">DIMENSIONS</text>
        <rect y="12" width="254" height="6" rx="3" fill="#334155"/>
        <rect y="12" width="45" height="6" rx="3" fill="url(#score)"/>
        <rect y="12" width="254" height="6" rx="3" fill="none"/>
        <g fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="10">
          <text x="0" y="35">Complete</text>
          <text x="64" y="35">Unique</text>
          <text x="123" y="35">Valid</text>
          <text x="171" y="35">Consistent</text>
          <text x="238" y="35" text-anchor="end">Plausible</text>
        </g>
      </g>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="112" fill="#f8fafc" font-size="58" font-weight="750" letter-spacing="-1">AI Data Quality</text>
    <text x="70" y="158" fill="#cbd5e1" font-size="31" font-weight="650">Intelligence Platform</text>
    <rect x="72" y="177" width="230" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="214" fill="#94a3b8" font-size="20">Deterministic scans. Reviewable results. Optional Gemini.</text>

    <g transform="translate(70 238)" font-size="14" font-weight="700">
      <rect width="108" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#38bdf8" stroke-opacity=".38"/>
      <text x="54" y="25" fill="#dbeafe" text-anchor="middle">CSV + XLSX</text>

      <rect x="118" width="130" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#818cf8" stroke-opacity=".38"/>
      <text x="183" y="25" fill="#e0e7ff" text-anchor="middle">5 DIMENSIONS</text>

      <rect x="258" width="150" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#c084fc" stroke-opacity=".38"/>
      <text x="333" y="25" fill="#f3e8ff" text-anchor="middle">GEMINI ADVISORY</text>

      <rect x="418" width="162" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#22c55e" stroke-opacity=".38"/>
      <text x="499" y="25" fill="#dcfce7" text-anchor="middle">SOURCE READ-ONLY</text>
    </g>
  </g>
</svg>
