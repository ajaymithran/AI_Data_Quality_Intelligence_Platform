[project]
name = "universal-data-quality-scanner"
version = "0.1.0"
description = "Standalone CSV data-quality scanner with a web interface at /universal"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
